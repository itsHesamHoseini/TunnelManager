events { worker_connections 512; }
http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  server {
    listen 9443 ssl;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_conn connections 20;
    location ~ ^/api/(login|mfa|enroll) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://controller:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }
    location = /api/agent {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://controller:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 75s;
    }
    location / {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://controller:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
    error_page 429 = @rate_limit;
    location @rate_limit {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"code":"rate_limited","message":"Too many requests. Wait one minute.","message_fa":"درخواست‌ها زیاد است؛ یک دقیقه صبر کنید."}';
    }
  }
}
