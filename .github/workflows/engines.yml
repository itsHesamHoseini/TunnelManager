name: Native engine workflows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: docker build -t tunnelmanager-native-lab -f scripts/native-lab.Dockerfile .
      - run: go test -tags nativelab -timeout 25m -v ./internal/nodeops
        env:
          TUNNELMANAGER_NATIVE_LAB: '1'
