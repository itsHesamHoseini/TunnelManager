name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: tunnelmanager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/tunnelmanager_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: node scripts/check.mjs
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: gitleaks git . --log-opts="--all" --redact --no-banner
      - run: gitleaks dir . --redact --no-banner
      - run: sh scripts/compose-smoke.sh

      - run: sh scripts/installer-smoke.sh

      - run: sh scripts/node-smoke.sh
